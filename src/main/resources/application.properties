# ================= ????? =================
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pblog}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:library_app}
spring.datasource.password=${MYSQL_PASSWORD:AppPassword123!}

# ================= MyBatis ?? =================
# mybatis.config-locations=classpath:mybatis/mybatis-config.xml
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.paton.domain

# ================= ???? =================
spring.mvc.view.prefix=classpath:/templates/
spring.mvc.view.suffix=.html

# ================= ?????? =================
spring.resources.chain.cache=false
spring.resources.static-locations=classpath:/static/,file:${file.upload.base-dir}

# ================= ?????? =================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ================= ????????? =================
# ??????????????????Windows??D:/uploads/?Linux??/home/uploads/?
file.upload.base-dir=${UPLOAD_DIR:D\:/uploads/}
file.upload.avatar-dir=${file.upload.base-dir}avatars/
file.upload.book-cover-dir=${file.upload.base-dir}book-covers/

# ?????????static??????
file.default.avatar=/images/default-avatar.png

# ================= Thymeleaf ?? =================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ================= ???? =================
logging.level.com.paton=DEBUG

# ================= ????? =================
server.port=8080

# ================= Session ?? =================
server.servlet.session.timeout=30m