<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理员后台</title>
    <script src="/scripts/jquery-3.3.1.min.js"></script>
    <script src="/scripts/jquery.validate.min.js"></script>
    <script src="/scripts/messages_zh.min.js"></script>
    <script src="/scripts/base/admin_base.js"></script>
    <link href="/css/myUIstyle.css" rel="stylesheet" />
    <style>
        /* 子菜单激活状态 */
        .header__nav li ul li a.nav-active {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.08) !important;
            border-left: 3px solid #4CAF50 !important;
            padding-left: 0.9rem !important;
        }

        /* ========== 视频背景（仅覆盖主内容区域） ========== */
        .main-content {
            position: relative;
            background: transparent !important;
            overflow: hidden;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        .welcome-container {
            position: relative;
            z-index: 2;
        }

        .welcome-container h2 {
            color: #ffffff;
            font-size: 2.5rem;
        }

        .welcome-container p {
            color: rgba(255, 255, 255, 0.7) !important;
        }
    </style>
</head>
<body>

<!-- 侧边导航栏 -->
<header class="s-header">

    <!-- 头像 + 用户名区域 -->
    <div class="header__logo">
        <img class="avatar-img"
             src="/images/default-avatar.png"
             alt="管理员头像">
        <p class="username">admin</p>
        <p class="user-role">管理员</p>
    </div>

    <!-- 导航菜单 -->
    <div class="header__nav-wrap">
        <ul class="header__nav">
            <li class="nav-home">
                <a href="#" id="navHome">首页</a>
            </li>
            <li class="has-children" id="click_1">
                <a href="#">书籍管理</a>
                <ul id="sub_1">
                    <li><a href="#" data-page="addBook">录入新书</a></li>
                    <li><a href="#" data-page="addCategory">新建类别</a></li>
                    <li><a href="#" data-page="showBooks">查询书籍</a></li>
                    <li><a href="#" data-page="bookStatistics">书籍统计</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_2">
                <a href="#">用户管理</a>
                <ul id="sub_2">
                    <li><a href="#" data-page="showUsers">查询用户</a></li>
                    <li><a href="#" data-page="addUser">新增用户</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_3">
                <a href="#">借阅信息</a>
                <ul id="sub_3">
                    <li><a href="#" data-page="allBorrowRecords">所有记录</a></li>
                    <li><a href="#" data-page="adminUserFavorites">查看用户收藏</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_4">
                <a href="#">帮助</a>
                <ul id="sub_4">
                    <li><a href="#" data-page="operationLog">操作日志查询</a></li>
                </ul>
            </li>
        </ul>

        <!-- 底部退出 -->
        <div class="header__bottom">
            <a href="/adminLogOut">退出登录</a>
        </div>
    </div>

</header>

<!-- 主内容区域 -->
<main class="main-content" id="main-content">
    <!-- 视频背景 -->
    <video class="video-background" autoplay muted loop playsinline>
        <source src="/videos/admin-bg.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="welcome-container" style="text-align:center;padding:80px 20px;">
        <h2>欢迎使用图书管理系统</h2>
        <p style="color:#999;margin-top:15px;">请从左侧导航栏选择功能</p>
    </div>
</main>

</body>
</html>
