<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新建类别</title>
    <script src="/scripts/jquery-3.3.1.min.js"></script>
    <script src="/scripts/jquery.validate.min.js"></script>
    <script src="/scripts/messages_zh.min.js"></script>
    <script src="/scripts/admin/addBookCategory.js"></script>
    <script src="/scripts/base/admin_base.js"></script>
    <link href="/css/myUIstyle.css" rel="stylesheet" />
    <style>
        :root {
            --input-focus: #2d8cf0;
            --font-color: #323232;
            --font-color-sub: #666;
            --bg-color: #fff;
            --main-color: #323232;
        }

        .category-page-layout {
            display: flex;
            gap: 40px;
            padding: 30px;
            min-height: 70vh;
        }

        .category-left {
            flex: 0 0 380px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        .category-right {
            flex: 1;
        }

        .add-category-card {
            width: 340px;
            padding: 30px 25px;
            background: #f0f0f0;
            border-radius: 5px;
            border: 2px solid var(--main-color);
            box-shadow: 4px 4px var(--main-color);
        }

        .add-category-card .card-title {
            margin: 10px 0 25px 0;
            font-size: 25px;
            font-weight: 900;
            text-align: center;
            color: var(--main-color);
        }

        .add-category-card .card-icon {
            text-align: center;
            font-size: 40px;
            margin-bottom: 5px;
        }

        .add-category-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .add-category-form .form-input {
            width: 250px;
            height: 40px;
            border-radius: 5px;
            border: 2px solid var(--main-color);
            background-color: var(--bg-color);
            box-shadow: 4px 4px var(--main-color);
            font-size: 15px;
            font-weight: 600;
            color: var(--font-color);
            padding: 5px 10px;
            outline: none;
            box-sizing: border-box;
        }

        .add-category-form .form-input::placeholder {
            color: var(--font-color-sub);
            opacity: 0.8;
        }

        .add-category-form .form-input:focus {
            border: 2px solid var(--input-focus);
        }

        .add-category-form .form-btn {
            margin: 10px 0 10px 0;
            width: 120px;
            height: 40px;
            border-radius: 5px;
            border: 2px solid var(--main-color);
            background-color: var(--bg-color);
            box-shadow: 4px 4px var(--main-color);
            font-size: 17px;
            font-weight: 600;
            color: var(--font-color);
            cursor: pointer;
        }

        .add-category-form .form-btn:active {
            box-shadow: 0px 0px var(--main-color);
            transform: translate(3px, 3px);
        }

        .add-category-card .hint-text {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }

        .category-right .section-title {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #999;
            padding-bottom: 10px;
        }
        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .records-table th, .records-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .records-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .records-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .records-table tr:hover {
            background-color: #f5f5f5;
        }
        .records-table .btn-delete-category {
            padding: 6px 16px;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .records-table .btn-delete-category:hover {
            background-color: #c0392b;
        }
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
        }
        .pagination .page-info {
            color: #666;
            font-size: 14px;
        }
        .pagination a {
            padding: 8px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .pagination a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<header class="s-header">
    <div class="header__logo">
        <img class="avatar-img" src="/images/default-avatar.png" alt="管理员头像">
        <p class="username">admin</p>
        <p class="user-role">管理员</p>
    </div>
    <div class="header__nav-wrap">
        <ul class="header__nav">
            <li class="has-children open" id="click_1">
                <a href="#">书籍管理</a>
                <ul id="sub_1" style="display:block">
                    <li><a href="/addBookPage">录入新书</a></li>
                    <li><a href="/addCategoryPage?pageNum=1" style="color:#ffffff">新建类别</a></li>
                    <li><a href="/showBooksPage">查询书籍</a></li>
                    <li><a href="/bookStatisticsPage">书籍统计</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_2">
                <a href="#">用户管理</a>
                <ul id="sub_2">
                    <li><a href="/showUsersPage?pageNum=1">查询用户</a></li>
                    <li><a href="/addUserPage">新增用户</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_3">
                <a href="#">借阅信息</a>
                <ul id="sub_3">
                    <li><a href="/allBorrowingBooksRecordPage?pageNum=1">所有记录</a></li>
                    <li><a href="/adminUserFavoritesPage">查看用户收藏</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_4">
                <a href="#">帮助</a>
                <ul id="sub_4">
                    <li><a href="/operationLogPage">操作日志查询</a></li>
                </ul>
            </li>
        </ul>
        <div class="header__bottom">
            <a href="/adminLogOut">退出登录</a>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="category-page-layout">
        <div class="category-left">
            <div class="add-category-card">
                <div class="card-icon">📁</div>
                <div class="card-title">新建类别</div>

                <form id="addBookCategoryForm" class="add-category-form">
                    <input class="form-input" id="categoryId" type="text" name="categoryId" placeholder="类别编号">
                    <input class="form-input" id="categoryName" type="text" name="categoryName" placeholder="类别名称">
                    <input name="pageNum" value="1" style="display: none">
                    <input type="submit" id="btn_addBookCategory" class="form-btn" value="添加类别">
                </form>

                <p class="hint-text">填写信息后点击按钮即可新建类别</p>
            </div>
        </div>

        <div class="category-right">
            <h2 class="section-title">已有类别</h2>

            <div th:if="${page != null and page.list != null and !page.list.empty}">
                <table class="records-table">
                    <thead>
                    <tr>
                        <th>序号</th>
                        <th>类别编号</th>
                        <th>类别名称</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="bookCategory, stat : ${page.getList()}">
                        <td th:text="${stat.index + 1}"></td>
                        <td th:text="${bookCategory.getCategoryId()}"></td>
                        <td th:text="${bookCategory.getCategoryName()}"></td>
                        <td><button class="btn-delete-category" th:value="${bookCategory.getCategoryId()}">删除</button></td>
                    </tr>
                    </tbody>
                </table>

                <div class="pagination" th:if="${page.pageCount > 1}">
                    <a id="prePage" th:href="@{/addCategoryPage(pageNum=${page.getPageNum()-1})}">上一页</a>
                    <span class="page-info">
                        <label id="lab1" th:text="${page.getPageNum()}">1</label> / <label id="lab2" th:text="${page.getPageCount()}">1</label>
                    </span>
                    <a id="nextPage" th:href="@{/addCategoryPage(pageNum=${page.getPageNum()+1})}">下一页</a>
                </div>
            </div>

            <div th:if="${page == null or page.list == null or page.list.empty}" class="empty-message">
                <p>暂无类别数据</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
