<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>所有借书记录</title>
    <script src="/scripts/jquery-3.3.1.min.js"></script>
    <script src="/scripts/base/admin_base.js"></script>
    <link href="/css/myUIstyle.css" rel="stylesheet" />
    <script src="/scripts/admin/allBorrowingBooksRecord.js"></script>
    <style>
        .page-title {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #999;
            padding-bottom: 10px;
        }
        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .records-table th, .records-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .records-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .records-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .records-table tr:hover {
            background-color: #f5f5f5;
        }
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
        }
        .pagination .page-info {
            color: #666;
            font-size: 14px;
        }
        .pagination a {
            padding: 8px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .pagination a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<header class="s-header">
    <div class="header__logo">
        <img class="avatar-img" src="/images/default-avatar.png" alt="管理员头像">
        <p class="username">admin</p>
        <p class="user-role">管理员</p>
    </div>
    <div class="header__nav-wrap">
        <ul class="header__nav">
            <li class="has-children" id="click_1">
                <a href="#">书籍管理</a>
                <ul id="sub_1">
                    <li><a href="/addBookPage">录入新书</a></li>
                    <li><a href="/addCategoryPage?pageNum=1">新建类别</a></li>
                    <li><a href="/showBooksPage">查询书籍</a></li>
                    <li><a href="/bookStatisticsPage">书籍统计</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_2">
                <a href="#">用户管理</a>
                <ul id="sub_2">
                    <li><a href="/showUsersPage?pageNum=1">查询用户</a></li>
                    <li><a href="/addUserPage">新增用户</a></li>
                </ul>
            </li>
            <li class="has-children open" id="click_3">
                <a href="#">借阅信息</a>
                <ul id="sub_3" style="display:block">
                    <li><a href="/allBorrowingBooksRecordPage?pageNum=1" style="color:#ffffff">所有记录</a></li>
                    <li><a href="/adminUserFavoritesPage">查看用户收藏</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_4">
                <a href="#">帮助</a>
                <ul id="sub_4">
                    <li><a href="/operationLogPage">操作日志查询</a></li>
                </ul>
            </li>
        </ul>
        <div class="header__bottom">
            <a href="/adminLogOut">退出登录</a>
        </div>
    </div>
</header>

<main class="main-content">
    <h2 class="page-title">所有借书记录</h2>

    <div th:if="${page != null and page.list != null and !page.list.empty}">
        <table class="records-table">
            <thead>
            <tr>
                <th>序号</th>
                <th>用户</th>
                <th>书籍</th>
                <th>借书日期</th>
                <th>还书日期</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="borrowingBooks, stat : ${page.getList()}">
                <td th:text="${stat.index + 1}"></td>
                <td th:text="${borrowingBooks.getUser().getUserName()}"></td>
                <td th:text="${borrowingBooks.getBook().getBookName()}"></td>
                <td th:text="${borrowingBooks.getDateOfBorrowing()}"></td>
                <td th:text="${borrowingBooks.getDateOfReturn()}"></td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${page.pageCount > 1}">
            <a id="prePage" th:href="@{/allBorrowingBooksRecordPage(pageNum=${page.getPageNum()-1})}">上一页</a>
            <span class="page-info">
                <label id="lab1" th:text="${page.getPageNum()}">1</label> / <label id="lab2" th:text="${page.getPageCount()}">1</label>
            </span>
            <a id="nextPage" th:href="@{/allBorrowingBooksRecordPage(pageNum=${page.getPageNum()+1})}">下一页</a>
        </div>
    </div>

    <div th:if="${page == null or page.list == null or page.list.empty}" class="empty-message">
        <p>📚 暂无借阅记录</p>
    </div>
</main>
</body>
</html>
