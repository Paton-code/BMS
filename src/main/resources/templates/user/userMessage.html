<main class="main-content">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .form {
            --input-focus: #2d8cf0;
            --font-color: #323232;
            --font-color-sub: #666;
            --bg-color: rgba(255,255,255,0.95);
            --main-color: #ddd;
            padding: 30px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            border-radius: 5px;
            border: 2px solid var(--main-color);
            box-shadow: 4px 4px rgba(0,0,0,0.15);
            max-width: 400px;
            margin: 40px auto;
        }
        .title { color: var(--font-color); font-weight: 900; font-size: 24px; text-align: center; }
        .title span { color: var(--font-color-sub); font-weight: 600; font-size: 15px; }
        .input {
            width: 280px; height: 40px; border-radius: 5px;
            border: 2px solid var(--main-color);
            background-color: #f5f5f5;
            box-shadow: 2px 2px rgba(0,0,0,0.1);
            font-size: 14px; font-weight: 600; color: #323232;
            padding: 5px 10px; outline: none; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .input:focus { border-color: var(--input-focus); background-color: #fff; }
        .input[readonly] { cursor: default; }
        .button {
            width: 120px; height: 40px; border-radius: 5px;
            border: 2px solid var(--main-color);
            background-color: var(--bg-color);
            box-shadow: 2px 2px rgba(0,0,0,0.15);
            font-size: 15px; font-weight: 600; color: #323232; cursor: pointer;
        }
        .button:active { box-shadow: 0px 0px; transform: translate(2px,2px); }
        .button-primary { background-color: #2d8cf0; color: white; border-color: #2d8cf0; }
        .button-group { display: flex; gap: 10px; justify-content: center; }
        .hint { font-size: 12px; color: #999; text-align: center; margin-top: -10px; }
        .avatar-preview {
            width: 90px; height: 90px; border-radius: 50%; overflow: hidden;
            border: 3px solid #ddd; margin: 0 auto 8px;
        }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .btn-upload {
            padding: 6px 14px; font-size: 13px; border-radius: 4px;
            border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; color: #555;
        }
    </style>

    <div class="form">
        <div class="title">个人信息<br><span>管理您的账户信息</span></div>

        <div style="text-align:center;">
            <div class="avatar-preview">
                <img id="userAvatar" th:src="${session.user.getAvatar() != null} ? ${session.user.getAvatar()} : '/images/default-avatar.png'" alt="头像">
            </div>
            <div id="avatarEditGroup" style="display:none;">
                <input type="file" id="avatarFile" accept="image/*" style="display:none;">
                <button type="button" id="selectAvatarBtn" class="btn-upload">选择头像</button>
                <div class="hint" id="avatarHint" style="display:none;"></div>
            </div>
        </div>

        <div style="position:relative;">
            <span class="prefix-label" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#999;font-size:14px;font-weight:600;pointer-events:none;z-index:1;">用户ID：</span>
            <input type="text" class="input" th:value="${session.user.getUserId()}" readonly style="padding-left:64px;">
        </div>
        <div style="position:relative;">
            <span class="prefix-label" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#999;font-size:14px;font-weight:600;pointer-events:none;z-index:1;">用户名：</span>
            <input type="text" id="name" class="input" th:value="${session.user.getUserName()}" readonly style="padding-left:64px;">
        </div>
        <div style="position:relative;">
            <span class="prefix-label" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#999;font-size:14px;font-weight:600;pointer-events:none;z-index:1;">邮箱：</span>
            <input type="email" id="email" class="input" th:value="${session.user.getUserEmail()}" readonly style="padding-left:50px;">
        </div>
        <div id="pwdField" style="display:none;">
            <input type="password" id="password" class="input" placeholder="新密码（不修改请留空）">
            <div class="hint">留空则不修改密码</div>
        </div>

        <div class="button-group" id="editGroup">
            <button type="button" id="editBtn" class="button button-primary">修改基本信息</button>
        </div>
        <div class="button-group" id="saveGroup" style="display:none;">
            <button type="button" id="saveBtn" class="button button-primary">保存</button>
            <button type="button" id="cancelBtn" class="button">取消</button>
        </div>
    </div>

    <script>
        $.ajax({
            url: '/getUserAvatar',
            type: 'GET',
            success: function(response) {
                if (response.success && response.avatar) {
                    $('#userAvatar').attr('src', response.avatar);
                }
            }
        });
    </script>
</main>
