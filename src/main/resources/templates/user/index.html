<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户首页</title>
    <script src="/scripts/jquery-3.3.1.min.js"></script>
    <script src="/scripts/jquery.validate.min.js"></script>
    <script src="/scripts/messages_zh.min.js"></script>
    <link href="/css/myUIstyle.css" rel="stylesheet" />
    <script src="/scripts/base/user_base.js"></script>
    <script>
        window._isLoggedIn = true;
        window._userId = /*[[${session.user.getUserId()}]]*/ null;
        window._userName = '[[${session.user.getUserName()}]]';
    </script>
    <style>
        /* 子菜单激活状态 */
        .header__nav li ul li a.nav-active {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.08) !important;
            border-left: 3px solid #4CAF50 !important;
            padding-left: 0.9rem !important;
        }

        /* ========== 视频背景（仅覆盖主内容区域） ========== */
        .main-content {
            position: relative;
            background: transparent !important;
            overflow: hidden;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        .welcome-container {
            position: relative;
            z-index: 2;
        }

        .welcome-container h2 {
            color: #ffffff;
            font-size: 2.5rem;
        }

        .welcome-container p {
            color: rgba(255, 255, 255, 0.7) !important;
        }
    </style>
</head>
<body>

<!-- 侧边导航栏 -->
<header class="s-header">

    <!-- 头像 + 用户名区域 -->
    <div class="header__logo">
        <img class="avatar-img"
             th:src="${session.user.getAvatar() != null} ? ${session.user.getAvatar()} : '/images/default-avatar.png'"
             alt="用户头像">
        <p class="username" th:text="${session.user.getUserName()}">用户名</p>
        <p class="user-role">用户</p>
    </div>

    <!-- 导航菜单 -->
    <div class="header__nav-wrap">
        <ul class="header__nav">
            <li class="nav-home">
                <a href="#" id="navHome">首页</a>
            </li>
            <li class="has-children" id="click_1">
                <a href="#">借阅管理</a>
                <ul id="sub_1">
                    <li><a href="#" data-page="borrowingBookRecord">借书记录</a></li>
                    <li><a href="#" data-page="borrowingBook">借阅书籍</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_2">
                <a href="#">书籍管理</a>
                <ul id="sub_2">
                    <li><a href="#" data-page="returnBook">归还书籍</a></li>
                    <li><a href="#" data-page="findBook">查询书籍</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_3">
                <a href="#">个人信息</a>
                <ul id="sub_3">
                    <li><a href="#" data-page="userMessage">我的信息</a></li>
                </ul>
            </li>
            <li class="has-children" id="click_4">
                <a href="#">帮助</a>
                <ul id="sub_4">
                    <li><a href="#" data-page="userFavorites">我的收藏</a></li>
                </ul>
            </li>
        </ul>

        <!-- 底部退出 -->
        <div class="header__bottom">
            <a href="/userLogOut">退出登录</a>
        </div>
    </div>

</header>

<!-- 主内容区域 -->
<main class="main-content" id="main-content">
    <!-- 视频背景 -->
    <video class="video-background" autoplay muted loop playsinline>
        <source src="/videos/admin-bg.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="welcome-container" style="text-align:center;padding:80px 20px;">
        <h2>欢迎使用图书管理系统</h2>
        <p style="color:#999;margin-top:15px;">请从左侧导航栏选择功能</p>
    </div>
</main>

</body>
</html>
